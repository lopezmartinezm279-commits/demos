<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="Patio de la taberna de noche con mesas, farol y planta">
  <defs>
    <linearGradient id="rp6Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212819"/><stop offset="1" stop-color="#12160f"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#rp6Bg)"/>
  <!-- luna y estrellas -->
  <path d="M560 100 A 58 58 0 1 0 618 176 A 46 46 0 0 1 560 100 Z" fill="#f1ead9" opacity=".85"/>
  <g fill="#f1ead9" opacity=".6">
    <circle cx="120" cy="110" r="6"/><circle cx="240" cy="70" r="5"/><circle cx="420" cy="120" r="5"/>
  </g>
  <!-- arco del patio -->
  <path d="M80 560 V 300 Q 80 160 220 160 Q 360 160 360 300 V 560" fill="none" stroke="#c9a35f" stroke-width="14" opacity=".6"/>
  <!-- farol encendido -->
  <g>
    <path d="M220 208 V 250" stroke="#c9a35f" stroke-width="8" fill="none"/>
    <circle cx="220" cy="300" r="64" fill="#c9a35f" opacity=".2"/>
    <rect x="196" y="254" width="48" height="70" rx="10" fill="#171c13" stroke="#c9a35f" stroke-width="8"/>
    <rect x="208" y="268" width="24" height="42" rx="8" fill="#e8c987"/>
    <rect x="190" y="320" width="60" height="12" rx="6" fill="#c9a35f"/>
  </g>
  <!-- mesa 1 con mantel -->
  <g>
    <path d="M120 470 H 320 L 336 560 H 104 Z" fill="#f1ead9"/>
    <rect x="196" y="560" width="18" height="80" fill="#c9a35f"/>
    <rect x="150" y="440" width="60" height="30" rx="8" fill="#8d3a47"/>
    <circle cx="262" cy="452" r="18" fill="#8d3a47"/>
    <rect x="256" y="452" width="12" height="24" fill="#8d3a47"/>
  </g>
  <!-- mesa 2 al fondo -->
  <g>
    <path d="M420 500 H 570 L 582 570 H 408 Z" fill="#f1ead9" opacity=".9"/>
    <rect x="486" y="570" width="16" height="66" fill="#c9a35f"/>
    <circle cx="470" cy="486" r="14" fill="#8d3a47"/>
    <rect x="516" y="474" width="42" height="26" rx="6" fill="#c9a35f"/>
  </g>
  <!-- planta en maceta -->
  <g>
    <path d="M596 560 H 668 L 656 640 H 608 Z" fill="#8d3a47"/>
    <g stroke="#c9a35f" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M632 560 V 470"/>
      <path d="M632 520 Q 590 500 578 456"/>
      <path d="M632 520 Q 674 500 686 456"/>
    </g>
    <circle cx="632" cy="456" r="18" fill="#c9a35f"/>
    <circle cx="574" cy="444" r="14" fill="#c9a35f"/>
    <circle cx="690" cy="444" r="14" fill="#c9a35f"/>
  </g>
  <!-- suelo empedrado -->
  <path d="M0 652 H 700" stroke="#c9a35f" stroke-width="6" opacity=".3" fill="none"/>
  <g fill="#c9a35f" opacity=".18">
    <ellipse cx="140" cy="672" rx="40" ry="10"/>
    <ellipse cx="330" cy="678" rx="46" ry="10"/>
    <ellipse cx="530" cy="672" rx="40" ry="10"/>
  </g>
</svg>
