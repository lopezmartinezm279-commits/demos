  </defs>
  <rect width="800" height="600" fill="url(#ref102Bg)"/>
  <circle cx="180" cy="150" r="150" fill="#b9924b" opacity=".1"/>
  <!-- ventana pequeña -->
  <rect x="600" y="90" width="130" height="170" rx="8" fill="#b9924b" opacity=".25"/>
  <rect x="600" y="90" width="130" height="170" rx="8" fill="none" stroke="#f8f7f4" stroke-width="8"/>
  <rect x="660" y="94" width="8" height="162" fill="#f8f7f4"/>
