  </defs>
  <rect width="700" height="700" fill="url(#cliGFacBg)"/>
  <circle cx="350" cy="340" r="250" fill="#fdfbf8" opacity=".12"/>
  <!-- melena -->
  <path d="M350 110 C230 110 170 200 170 320 C170 430 200 520 240 560 L460 560 C500 520 530 430 530 320 C530 200 470 110 350 110 Z" fill="#3b342e" opacity=".9"/>
  <!-- rostro -->
