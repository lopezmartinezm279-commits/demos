<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="Rostro de frente con rodillo facial y ondas de radiofrecuencia">
  <defs>
    <linearGradient id="cliGFacBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f5330"/><stop offset="1" stop-color="#8d6b3f"/>
