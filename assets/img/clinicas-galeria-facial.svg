  <path d="M378 332 C390 340 408 340 420 330" fill="none" stroke="#3b342e" stroke-width="8" stroke-linecap="round"/>
  <path d="M330 424 C342 432 358 432 370 424" fill="none" stroke="#c98d84" stroke-width="10" stroke-linecap="round"/>
