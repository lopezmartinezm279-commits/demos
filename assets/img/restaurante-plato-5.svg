<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="Torrijas caramelizadas con bola de helado">
  <defs>
    <linearGradient id="rp5Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212819"/><stop offset="1" stop-color="#171c13"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#rp5Bg)"/>
  <circle cx="350" cy="340" r="280" fill="#c9a35f" opacity=".08"/>
  <!-- plato -->
  <ellipse cx="350" cy="470" rx="270" ry="120" fill="#f1ead9"/>
  <ellipse cx="350" cy="470" rx="216" ry="88" fill="none" stroke="#c9a35f" stroke-width="8" opacity=".7"/>
  <!-- torrijas apiladas -->
  <g>
    <rect x="190" y="392" width="320" height="72" rx="30" fill="#b98f4e"/>
    <rect x="216" y="330" width="300" height="72" rx="30" fill="#c9a35f"/>
    <path d="M240 358 Q 366 336 492 358" stroke="#e0c78f" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <!-- caramelo -->
  <path d="M250 400 Q 262 428 250 452 M 360 404 Q 372 434 362 458 M 460 398 Q 472 426 462 450" stroke="#722e39" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- bola de helado -->
  <circle cx="366" cy="272" r="86" fill="#f1ead9"/>
  <path d="M300 296 Q 366 322 432 296" stroke="#c9a35f" stroke-width="9" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- canela -->
  <g transform="rotate(-32 470 220)">
    <rect x="430" y="204" width="120" height="26" rx="13" fill="#8d3a47"/>
    <circle cx="444" cy="217" r="7" fill="#722e39"/>
  </g>
  <!-- hoja de menta -->
  <path d="M282 216 Q 258 180 288 158 Q 316 180 296 216 Z" fill="#c9a35f"/>
  <circle cx="560" cy="520" r="12" fill="#c9a35f"/>
  <circle cx="150" cy="540" r="9" fill="#c9a35f"/>
</svg>
