<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="Máquina de diagnosis conectada por cable a un vehículo">
  <defs>
    <linearGradient id="tgdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d63"/><stop offset="1" stop-color="#23578c"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#tgdBg)"/>
  <circle cx="170" cy="150" r="150" fill="#f6b900" opacity=".10"/>
  <rect x="30" y="600" width="640" height="16" rx="8" fill="#101c2c"/>
  <!-- máquina de diagnosis -->
  <g>
    <rect x="90" y="170" width="220" height="170" rx="20" fill="#eef2f7"/>
    <rect x="112" y="192" width="176" height="126" rx="12" fill="#173d63"/>
    <path d="M128 280 L160 280 L178 236 L202 300 L222 258 L272 258" fill="none" stroke="#f6b900" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="180" y="340" width="40" height="130" rx="14" fill="#eef2f7"/>
    <rect x="110" y="470" width="180" height="26" rx="13" fill="#eef2f7"/>
    <circle cx="140" cy="560" r="22" fill="#eef2f7"/>
    <circle cx="260" cy="560" r="22" fill="#eef2f7"/>
    <circle cx="140" cy="560" r="9" fill="#173d63"/>
    <circle cx="260" cy="560" r="9" fill="#173d63"/>
  </g>
  <!-- cable hasta el conector del coche -->
  <path d="M310 250 Q420 240 430 330 Q436 400 400 448" fill="none" stroke="#f6b900" stroke-width="14" stroke-linecap="round"/>
  <rect x="378" y="440" width="44" height="30" rx="9" fill="#f6b900"/>
  <!-- frontal del coche entrando por la derecha -->
