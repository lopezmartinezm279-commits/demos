  <path d="M538 480 Q576 430 630 430 L680 430 L680 480 Z" fill="#173d63"/>
  <circle cx="524" cy="600" r="44" fill="#171b20"/><circle cx="524" cy="600" r="19" fill="#eef2f7"/>
  <rect x="428" y="530" width="54" height="34" rx="16" fill="#f6b900"/>
