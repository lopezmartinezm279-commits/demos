  <rect x="420" y="360" width="280" height="90" rx="24" fill="#faf8f5"/>
  <rect x="470" y="310" width="90" height="76" rx="12" fill="#f59e0b"/>
  <rect x="446" y="450" width="26" height="36" rx="7" fill="#221c17"/>
  <rect x="648" y="450" width="26" height="36" rx="7" fill="#221c17"/>
  <!-- mesa auxiliar con planta -->
  <ellipse cx="220" cy="380" rx="90" ry="16" fill="#faf8f5"/>
  <path d="M220 392 V 480" fill="none" stroke="#faf8f5" stroke-width="12" stroke-linecap="round"/>
  <rect x="192" y="316" width="56" height="52" rx="8" fill="#221c17" opacity=".85"/>
  <path d="M220 316 C196 276 196 246 220 220 C244 246 244 276 220 316 Z" fill="#f59e0b" opacity=".9"/>
