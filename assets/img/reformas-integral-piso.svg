<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Salón tras reforma integral con sillón, cuadro y lámpara colgante">
  <defs>
    <linearGradient id="refIntBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3412"/><stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#refIntBg)"/>
  <circle cx="660" cy="100" r="160" fill="#faf8f5" opacity=".12"/>
  <circle cx="90" cy="540" r="130" fill="#f59e0b" opacity=".10"/>
  <!-- suelo -->
  <rect x="0" y="440" width="800" height="160" fill="#221c17" opacity=".18"/>
  <!-- cuadro -->
