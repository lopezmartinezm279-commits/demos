  <rect x="160" y="396" width="50" height="12" rx="6" fill="#142a4c"/>
  <rect x="350" y="360" width="50" height="12" rx="6" fill="#142a4c"/>
  <rect x="350" y="430" width="50" height="12" rx="6" fill="#142a4c"/>
  <!-- horno -->
  <rect x="500" y="352" width="200" height="120" rx="10" fill="#142a4c"/>
  <rect x="516" y="382" width="168" height="72" rx="8" fill="#b9924b" opacity=".5"/>
  <rect x="516" y="360" width="168" height="10" rx="5" fill="#f8f7f4"/>
  <!-- suelo -->
  <rect x="60" y="540" width="680" height="12" rx="6" fill="#b9924b" opacity=".4"/>
