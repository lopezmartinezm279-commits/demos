<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Cocina equipada con muebles, campana y encimera">
  <defs>
    <linearGradient id="ref105Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1d36"/><stop offset="1" stop-color="#142a4c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ref105Bg)"/>
  <circle cx="640" cy="140" r="140" fill="#b9924b" opacity=".1"/>
  <!-- muebles altos -->
  <g fill="#f8f7f4" opacity=".9">
    <rect x="90" y="80" width="130" height="110" rx="8"/>
    <rect x="240" y="80" width="130" height="110" rx="8"/>
  </g>
  <rect x="140" y="128" width="30" height="10" rx="5" fill="#142a4c"/>
  <rect x="290" y="128" width="30" height="10" rx="5" fill="#142a4c"/>
  <!-- campana -->
  <path d="M480 80 L 600 80 L 600 130 L 540 170 L 480 130 Z" fill="#b9924b"/>
  <rect x="524" y="160" width="32" height="30" fill="#b9924b" opacity=".7"/>
  <!-- balda con tarros -->
  <rect x="620" y="180" width="130" height="12" rx="6" fill="#b9924b"/>
  <rect x="636" y="140" width="26" height="40" rx="6" fill="#f8f7f4"/>
  <rect x="674" y="128" width="26" height="52" rx="6" fill="#f8f7f4" opacity=".8"/>
  <rect x="712" y="146" width="26" height="34" rx="6" fill="#f8f7f4"/>
  <!-- encimera -->
  <rect x="70" y="300" width="660" height="26" rx="10" fill="#b9924b"/>
  <!-- placa de coccion -->
  <rect x="470" y="270" width="150" height="20" rx="8" fill="#0d1d36"/>
  <circle cx="505" cy="280" r="7" fill="#b9924b"/>
  <circle cx="545" cy="280" r="7" fill="#b9924b"/>
  <circle cx="585" cy="280" r="7" fill="#b9924b"/>
  <!-- fregadero y grifo -->
  <path d="M200 258 L 200 226 Q 200 210 216 210 L 244 210 L 244 226" fill="none" stroke="#f8f7f4" stroke-width="10"/>
  <rect x="160" y="258" width="120" height="16" rx="8" fill="#f8f7f4"/>
  <!-- muebles bajos -->
  <g fill="#f8f7f4" opacity=".92">
    <rect x="90" y="326" width="190" height="170" rx="10"/>
    <rect x="300" y="326" width="150" height="170" rx="10"/>
    <rect x="470" y="326" width="260" height="170" rx="10"/>
