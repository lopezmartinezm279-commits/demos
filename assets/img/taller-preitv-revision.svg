<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Revisión pre-ITV: disco de freno, faro y linterna">
  <defs>
    <linearGradient id="tpiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d63"/><stop offset="1" stop-color="#23578c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#tpiBg)"/>
  <circle cx="650" cy="480" r="180" fill="#f6b900" opacity=".10"/>
  <circle cx="150" cy="110" r="130" fill="#eef2f7" opacity=".08"/>
  <!-- disco de freno -->
  <g transform="translate(260,320)">
    <circle r="150" fill="#eef2f7"/>
    <circle r="96" fill="#dbe3ec"/>
    <circle r="54" fill="#173d63"/>
    <g fill="#173d63">
      <circle cx="0" cy="-75" r="13"/>
      <circle cx="71" cy="-23" r="13"/>
      <circle cx="44" cy="61" r="13"/>
      <circle cx="-44" cy="61" r="13"/>
      <circle cx="-71" cy="-23" r="13"/>
