    <path d="M186 -34 L320 -78 L320 46 L186 30 Z" fill="#f6b900" opacity=".22"/>
    <rect x="0" y="-22" width="142" height="44" rx="20" fill="#eef2f7"/>
    <rect x="134" y="-34" width="52" height="68" rx="12" fill="#f6b900"/>
