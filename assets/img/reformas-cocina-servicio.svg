<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Cocina reformada con muebles hasta el techo e isla central">
  <defs>
    <linearGradient id="refCocBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3412"/><stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#refCocBg)"/>
  <circle cx="680" cy="90" r="150" fill="#faf8f5" opacity=".10"/>
  <rect x="0" y="440" width="800" height="160" fill="#221c17" opacity=".18"/>
  <!-- columna de muebles hasta el techo -->
  <rect x="70" y="0" width="150" height="440" rx="8" fill="#faf8f5"/>
  <path d="M70 150 H220 M70 300 H220" fill="none" stroke="#c2410c" stroke-width="6" opacity=".35"/>
  <rect x="196" y="60" width="8" height="60" rx="4" fill="#221c17"/>
  <rect x="196" y="200" width="8" height="60" rx="4" fill="#221c17"/>
  <!-- muebles altos -->
  <rect x="250" y="0" width="480" height="130" rx="8" fill="#faf8f5"/>
  <path d="M410 0 V130 M570 0 V130" fill="none" stroke="#c2410c" stroke-width="6" opacity=".35"/>
  <!-- campana -->
  <path d="M430 130 h120 l30 90 h-180 z" fill="#f59e0b"/>
  <!-- encimera y muebles bajos -->
  <rect x="250" y="280" width="480" height="24" rx="6" fill="#f59e0b"/>
  <rect x="262" y="304" width="456" height="136" rx="8" fill="#faf8f5"/>
  <path d="M414 304 V440 M566 304 V440" fill="none" stroke="#c2410c" stroke-width="6" opacity=".35"/>
  <rect x="300" y="330" width="60" height="8" rx="4" fill="#221c17"/>
  <rect x="452" y="330" width="60" height="8" rx="4" fill="#221c17"/>
  <rect x="604" y="330" width="60" height="8" rx="4" fill="#221c17"/>
  <!-- isla -->
  <rect x="270" y="452" width="440" height="26" rx="8" fill="#f59e0b"/>
  <rect x="290" y="478" width="400" height="100" rx="10" fill="#faf8f5"/>
  <rect x="290" y="478" width="400" height="100" rx="10" fill="#221c17" opacity=".08"/>
  <circle cx="360" cy="466" r="8" fill="#221c17"/>
  <circle cx="420" cy="466" r="8" fill="#221c17"/>
</svg>
