  <!-- servicio sobre la mesa -->
  <circle cx="330" cy="368" r="18" fill="#f8f7f4"/>
  <circle cx="470" cy="368" r="18" fill="#f8f7f4"/>
  <rect x="384" y="342" width="32" height="38" rx="8" fill="#f8f7f4"/>
  <path d="M392 342 Q 400 320 408 342 Z" fill="#b9924b"/>
  <!-- suelo -->
