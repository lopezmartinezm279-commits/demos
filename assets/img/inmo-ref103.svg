  <g fill="#f8f7f4">
    <rect x="110" y="330" width="22" height="200" rx="10"/>
    <rect x="110" y="416" width="70" height="18" rx="8"/>
    <rect x="150" y="434" width="18" height="96" rx="8"/>
    <rect x="668" y="330" width="22" height="200" rx="10"/>
    <rect x="620" y="416" width="70" height="18" rx="8"/>
    <rect x="632" y="434" width="18" height="96" rx="8"/>
