  </defs>
  <rect width="800" height="600" fill="url(#ref103Bg)"/>
  <circle cx="400" cy="200" r="180" fill="#b9924b" opacity=".1"/>
  <!-- ventanal triple al fondo -->
  <g>
    <rect x="90" y="90" width="150" height="220" rx="8" fill="#b9924b" opacity=".22"/>
    <rect x="90" y="90" width="150" height="220" rx="8" fill="none" stroke="#f8f7f4" stroke-width="8"/>
    <rect x="560" y="90" width="150" height="220" rx="8" fill="#b9924b" opacity=".22"/>
    <rect x="560" y="90" width="150" height="220" rx="8" fill="none" stroke="#f8f7f4" stroke-width="8"/>
  </g>
  <!-- aparador central -->
  <rect x="300" y="200" width="200" height="100" rx="10" fill="#f8f7f4" opacity=".85"/>
  <rect x="330" y="228" width="60" height="14" rx="7" fill="#142a4c"/>
  <rect x="410" y="228" width="60" height="14" rx="7" fill="#142a4c"/>
  <rect x="330" y="262" width="140" height="14" rx="7" fill="#142a4c" opacity=".6"/>
  <circle cx="400" cy="170" r="24" fill="#b9924b" opacity=".8"/>
  <!-- lampara colgante -->
  <rect x="396" y="0" width="8" height="80" fill="#b9924b"/>
  <path d="M352 130 L 448 130 L 400 74 Z" fill="#b9924b"/>
