<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Salón comedor amplio con mesa, sillas y lámpara colgante">
  <defs>
    <linearGradient id="ref103Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1d36"/><stop offset="1" stop-color="#142a4c"/>
