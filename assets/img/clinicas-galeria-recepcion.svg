  <path d="M310 330 C296 300 296 280 310 262 C324 280 324 300 310 330 Z" fill="#c98d84"/>
  <!-- planta -->
  <rect x="574" y="440" width="86" height="110" rx="12" fill="#3b342e" opacity=".85"/>
  <path d="M617 440 C574 366 574 312 617 266 C660 312 660 366 617 440 Z" fill="#fdfbf8" opacity=".85"/>
  <path d="M617 440 C566 396 540 372 530 322 C586 320 606 358 617 440 Z" fill="#c98d84" opacity=".8"/>
</svg>
