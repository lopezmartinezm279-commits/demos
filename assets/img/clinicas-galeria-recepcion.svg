  <rect x="130" y="406" width="380" height="160" rx="14" fill="#fdfbf8"/>
  <path d="M130 500 H 510" fill="none" stroke="#c98d84" stroke-width="8" opacity=".5"/>
  <!-- jarrón sobre el mostrador -->
