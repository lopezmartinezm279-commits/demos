<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="Recepción de la clínica con mostrador, lámparas y planta">
  <defs>
    <linearGradient id="cliGRecBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f5330"/><stop offset="1" stop-color="#8d6b3f"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#cliGRecBg)"/>
  <circle cx="600" cy="120" r="130" fill="#c98d84" opacity=".14"/>
  <rect x="0" y="540" width="700" height="160" fill="#3b342e" opacity=".16"/>
  <!-- logo circular en pared -->
  <circle cx="350" cy="180" r="70" fill="none" stroke="#fdfbf8" stroke-width="12"/>
  <circle cx="350" cy="180" r="34" fill="#c98d84"/>
