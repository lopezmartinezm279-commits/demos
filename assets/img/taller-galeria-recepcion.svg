<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="Recepción del taller con mostrador y sala de espera">
  <defs>
    <linearGradient id="tgrBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d63"/><stop offset="1" stop-color="#23578c"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#tgrBg)"/>
  <circle cx="560" cy="150" r="160" fill="#f6b900" opacity=".10"/>
  <rect x="30" y="600" width="640" height="16" rx="8" fill="#101c2c"/>
  <!-- reloj de pared -->
  <circle cx="170" cy="150" r="52" fill="#eef2f7"/>
  <path d="M170 150 L170 118 M170 150 L194 162" fill="none" stroke="#173d63" stroke-width="10" stroke-linecap="round"/>
  <!-- mostrador -->
  <g>
    <rect x="360" y="330" width="290" height="270" rx="18" fill="#eef2f7"/>
    <rect x="360" y="330" width="290" height="46" rx="18" fill="#f6b900"/>
    <rect x="396" y="420" width="218" height="22" rx="11" fill="#173d63" opacity=".25"/>
    <rect x="396" y="470" width="150" height="22" rx="11" fill="#173d63" opacity=".25"/>
  </g>
  <!-- campanilla sobre el mostrador -->
  <path d="M556 306 A 26 26 0 0 0 608 306 Z" fill="#f6b900"/>
  <rect x="548" y="306" width="68" height="12" rx="6" fill="#f6b900"/>
  <!-- sillas de espera -->
  <g fill="#eef2f7">
    <rect x="70" y="380" width="110" height="112" rx="16"/>
    <rect x="70" y="470" width="130" height="30" rx="14"/>
    <rect x="78" y="500" width="22" height="100" rx="10"/>
    <rect x="164" y="500" width="22" height="100" rx="10"/>
  </g>
  <g fill="#eef2f7">
    <rect x="220" y="380" width="110" height="112" rx="16"/>
    <rect x="220" y="470" width="130" height="30" rx="14"/>
    <rect x="228" y="500" width="22" height="100" rx="10"/>
    <rect x="314" y="500" width="22" height="100" rx="10"/>
  </g>
  <!-- planta -->
  <g transform="translate(660,540)">
    <path d="M-26 0 Q-46 -70 -6 -96 Q-2 -50 -8 0 Z" fill="#f6b900"/>
    <path d="M4 0 Q34 -60 8 -104 Q-14 -56 -6 0 Z" fill="#eef2f7"/>
    <rect x="-30" y="0" width="52" height="60" rx="12" fill="#eef2f7"/>
  </g>
</svg>
