  <!-- puerta y ventana -->
  <rect x="366" y="420" width="68" height="120" rx="8" fill="#15803d"/>
  <circle cx="420" cy="482" r="6" fill="#f6fafb"/>
  <rect x="246" y="396" width="80" height="72" rx="10" fill="#0284c7" opacity=".8"/>
  <rect x="474" y="396" width="80" height="72" rx="10" fill="#0284c7" opacity=".8"/>
  <!-- suelo y arbusto -->
  <rect x="120" y="540" width="560" height="14" rx="7" fill="#0b3b22" opacity=".55"/>
  <circle cx="160" cy="512" r="30" fill="#f6fafb" opacity=".85"/>
  <circle cx="646" cy="510" r="34" fill="#f6fafb" opacity=".85"/>
