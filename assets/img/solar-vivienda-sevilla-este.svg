<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Vivienda unifamiliar con placas solares en el tejado">
  <defs>
    <linearGradient id="sviBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#116330"/><stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sviBg)"/>
  <circle cx="140" cy="480" r="180" fill="#0284c7" opacity=".14"/>
  <!-- sol -->
