    <path d="M282 306 L330 274 L394 274 L346 306 Z"/>
    <path d="M358 306 L406 274 L470 274 L422 306 Z"/>
    <path d="M434 306 L482 274 L546 274 L498 306 Z"/>
    <path d="M320 262 L360 236 L420 236 L380 262 Z"/>
    <path d="M392 262 L432 236 L492 236 L452 262 Z"/>
