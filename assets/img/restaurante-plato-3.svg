<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="Lomos de atún rojo marcados con sésamo en plato rectangular">
  <defs>
    <linearGradient id="rp3Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212819"/><stop offset="1" stop-color="#171c13"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#rp3Bg)"/>
  <circle cx="350" cy="350" r="280" fill="#c9a35f" opacity=".08"/>
  <!-- plato rectangular -->
  <g transform="rotate(-8 350 350)">
    <rect x="110" y="200" width="480" height="300" rx="26" fill="#f1ead9"/>
    <rect x="140" y="228" width="420" height="244" rx="18" fill="none" stroke="#c9a35f" stroke-width="8" opacity=".7"/>
    <!-- lomos de atún -->
    <g>
      <rect x="180" y="270" width="110" height="160" rx="16" fill="#9c3d4e"/>
      <rect x="180" y="270" width="110" height="34" rx="16" fill="#c9a35f"/>
      <rect x="310" y="270" width="110" height="160" rx="16" fill="#9c3d4e"/>
      <rect x="310" y="396" width="110" height="34" rx="16" fill="#c9a35f"/>
      <rect x="440" y="270" width="80" height="160" rx="16" fill="#722e39"/>
    </g>
    <!-- sésamo -->
    <g fill="#f1ead9">
      <circle cx="205" cy="340" r="7"/><circle cx="238" cy="368" r="7"/><circle cx="264" cy="330" r="7"/>
      <circle cx="222" cy="402" r="7"/><circle cx="338" cy="310" r="7"/><circle cx="372" cy="344" r="7"/>
      <circle cx="398" cy="308" r="7"/><circle cx="346" cy="372" r="7"/><circle cx="462" cy="320" r="7"/>
      <circle cx="492" cy="360" r="7"/><circle cx="470" cy="398" r="7"/>
    </g>
    <!-- hilo de soja -->
    <path d="M180 458 Q 350 440 520 458" stroke="#722e39" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <!-- palillos -->
  <g stroke="#c9a35f" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M170 560 L 540 528"/>
    <path d="M176 596 L 546 570"/>
  </g>
</svg>
